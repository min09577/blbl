name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.1.1)"
        required: true
        default: ''
      skip_debug:
        description: "Skip debug build"
        type: boolean
        default: false
      skip_release:
        description: "Skip signed release build"
        type: boolean
        default: false
      skip_tv:
        description: "Skip TV build"
        type: boolean
        default: false

permissions:
  contents: write


jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.resolve.outputs.version_name }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version_name=${TAG}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            VN="${{ inputs.version_name }}"
            if [ -z "${VN}" ]; then
              echo "::error::version_name is required for manual dispatch"
              exit 1
            fi
            echo "version_name=${VN}" >> "$GITHUB_OUTPUT"
            case "${VN}" in
              v*) echo "release_tag=${VN}" >> "$GITHUB_OUTPUT" ;;
              *)  echo "release_tag=v${VN}" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  build-debug:
    needs: version
    if: ${{ (github.event_name == 'push') || (inputs.skip_debug != true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: CI Gradle tuning
        run: |
          sed -i 's|^org.gradle.jvmargs.*|org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8|' gradle.properties
          sed -i 's|^kotlin.daemon.jvmargs.*|kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC|' gradle.properties
          sed -i 's|^org.gradle.workers.max.*|org.gradle.workers.max=1|' gradle.properties
          grep -q '^org.gradle.workers.max=' gradle.properties || echo 'org.gradle.workers.max=1' >> gradle.properties
      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: config-cache-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'app/build.gradle.kts') }}
          restore-keys: config-cache-${{ runner.os }}-
      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionName=${{ needs.version.outputs.version_name }} -PversionCode=${{ github.run_number }} --no-daemon --no-build-cache
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-release:
    needs: version
    if: ${{ (github.event_name == 'push') || (inputs.skip_release != true) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Check keystore
        id: check
        run: |
          if [ -z "${KP:-}" ]; then
            echo "SKIP: KEYSTORE_PASSWORD not set - will skip build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Grant gradlew permission
        if: steps.check.outputs.skip != 'true'
        run: chmod +x ./gradlew
      - name: CI Gradle tuning
        if: steps.check.outputs.skip != 'true'
        run: |
          sed -i 's|^org.gradle.jvmargs.*|org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8|' gradle.properties
          sed -i 's|^kotlin.daemon.jvmargs.*|kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC|' gradle.properties
          sed -i 's|^org.gradle.workers.max.*|org.gradle.workers.max=1|' gradle.properties
          grep -q '^org.gradle.parallel=' gradle.properties || echo 'org.gradle.parallel=true' >> gradle.properties
      - name: Cache Gradle configuration cache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: config-cache-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'app/build.gradle.kts') }}
          restore-keys: config-cache-${{ runner.os }}-
      - name: Generate keystore (release)
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 -storepass android -keypass android -dname "CN=BLBL, OU=Dev, O=BLBL, L=Shanghai, C=CN"
      - name: Build release APK
        if: steps.check.outputs.skip != 'true'
        env:
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSWORD: android
        run: ./gradlew assembleRelease -PversionName=${{ needs.version.outputs.version_name }} -PversionCode=${{ github.run_number }} --no-daemon --no-build-cache --stacktrace
      - name: Upload release APK
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  build-tv:
    needs: version
    if: ${{ (github.event_name == 'push') || (inputs.skip_tv != true) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Check TV keystore
        id: check-tv
        run: |
          if [ -z "${KP:-}" ]; then
            echo "SKIP: KEYSTORE_PASSWORD not set 锟?will skip TV build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Grant gradlew permission
        if: steps.check-tv.outputs.skip != 'true'
        run: chmod +x ./gradlew
      - name: CI Gradle tuning
        if: steps.check-tv.outputs.skip != 'true'
        run: |
          sed -i 's|^org.gradle.jvmargs.*|org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8|' gradle.properties
          sed -i 's|^kotlin.daemon.jvmargs.*|kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC|' gradle.properties
          sed -i 's|^org.gradle.workers.max.*|org.gradle.workers.max=1|' gradle.properties
          grep -q '^org.gradle.parallel=' gradle.properties || echo 'org.gradle.parallel=true' >> gradle.properties
      - name: Generate keystore
        if: steps.check-tv.outputs.skip != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEYSTORE_PASSWORD }}" -dname "CN=BLBL, OU=Dev, O=BLBL, L=Shanghai, C=CN"
      - name: Build TV APK
        if: steps.check-tv.outputs.skip != 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName=${{ needs.version.outputs.version_name }} -PversionCode=${{ github.run_number }} --no-daemon
      - name: Rename APK
        if: steps.check-tv.outputs.skip != 'true'
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk "output/blbl-tv-${{ needs.version.outputs.version_name }}.apk"
      - name: Upload TV APK
        if: steps.check-tv.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blbl-tv-apk
          path: "output/blbl-tv-${{ needs.version.outputs.version_name }}.apk"

  publish:
    needs: [version, build-debug, build-release, build-tv]
    if: ${{ always() && !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: artifacts/debug
        continue-on-error: true

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/release
        continue-on-error: true

      - name: Download TV APK
        uses: actions/download-artifact@v4
        with:
          name: blbl-tv-apk
          path: artifacts/tv
        continue-on-error: true

      - name: Collect APKs
        id: collect
        run: |
          APK_FILES=""
          VN="${{ needs.version.outputs.version_name }}"
          if [ -f artifacts/debug/app-debug.apk ]; then
            cp artifacts/debug/app-debug.apk "blbl-${VN}-debug.apk"
            APK_FILES="$APK_FILES blbl-${VN}-debug.apk"
          fi
          if [ -f artifacts/release/app-release.apk ]; then
            cp artifacts/release/app-release.apk "blbl-${VN}-release.apk"
            APK_FILES="$APK_FILES blbl-${VN}-release.apk"
          fi
          if ls artifacts/tv/*.apk 1>/dev/null 2>&1; then
            cp artifacts/tv/*.apk "blbl-tv-${VN}.apk"
            APK_FILES="$APK_FILES blbl-tv-${VN}.apk"
          fi
          echo "apk_files=${APK_FILES}" >> "$GITHUB_OUTPUT"
          echo "Built: $APK_FILES"

      - name: Create/Update GitHub Release
        if: steps.collect.outputs.apk_files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
        run: |
          APK_LIST="${{ steps.collect.outputs.apk_files }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists, appending APKs..."
            gh release upload "$RELEASE_TAG" $APK_LIST --clobber
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" $APK_LIST --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Upload to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX || secrets.R2_PREFIX }}
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "R2 not configured, skipping upload."
            exit 0
          fi
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y awscli
          fi
          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_REGION="auto"
          export AWS_EC2_METADATA_DISABLED=true
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          CLEAN="${VERSION_NAME#v}"
          PREFIX="${R2_PREFIX:-blbl}"
          PREFIX="${PREFIX%/}"
          [ -n "${PREFIX}" ] && PREFIX="${PREFIX}/"

          if [ -s CHANGELOG.md ]; then
            printf '%s' "${CLEAN}" > version
            aws s3 cp "version" "s3://${R2_BUCKET}/${PREFIX}version" --endpoint-url "${ENDPOINT}" --content-type "text/plain" --cache-control "no-cache"
            aws s3 cp "CHANGELOG.md" "s3://${R2_BUCKET}/${PREFIX}CHANGELOG.md" --endpoint-url "${ENDPOINT}" --content-type "text/markdown; charset=utf-8" --cache-control "no-cache"
          fi
          if [ -f artifacts/debug/app-debug.apk ]; then
            aws s3 cp "artifacts/debug/app-debug.apk" "s3://${R2_BUCKET}/${PREFIX}blbl-${CLEAN}-debug.apk" --endpoint-url "${ENDPOINT}" --content-type "application/vnd.android.package-archive"
            aws s3 cp "artifacts/debug/app-debug.apk" "s3://${R2_BUCKET}/${PREFIX}blbl-latest-debug.apk" --endpoint-url "${ENDPOINT}" --content-type "application/vnd.android.package-archive" --cache-control "no-cache"
          fi
          if [ -f artifacts/release/app-release.apk ]; then
            aws s3 cp "artifacts/release/app-release.apk" "s3://${R2_BUCKET}/${PREFIX}blbl-${CLEAN}-release.apk" --endpoint-url "${ENDPOINT}" --content-type "application/vnd.android.package-archive"
            aws s3 cp "artifacts/release/app-release.apk" "s3://${R2_BUCKET}/${PREFIX}blbl-latest-release.apk" --endpoint-url "${ENDPOINT}" --content-type "application/vnd.android.package-archive" --cache-control "no-cache"
          fi
          echo "R2 upload done"