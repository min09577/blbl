name: blbl AI Enhanced Build v6.4

env:
  VERSION_NAME: "11.19.0"
  VERSION_CODE: ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Generate keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass blbl2024 -keypass blbl2024 \
            -dname "CN=BLBL AI, OU=Enhanced, O=BLBL, L=Shanghai, C=CN"

      - name: Build signed APK
        env:
          RELEASE_STORE_PASSWORD: blbl2024
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSWORD: blbl2024
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PversionName=${{ env.VERSION_NAME }} -PversionCode=${{ env.VERSION_CODE }} --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/blbl-ai-enhanced-v${{ env.VERSION_NAME }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blbl-ai-enhanced-apk
          path: output/blbl-ai-enhanced-v${{ env.VERSION_NAME }}.apk

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.VERSION_NAME }}"
          APK="output/blbl-ai-enhanced-v${{ env.VERSION_NAME }}.apk"
          
          # Delete existing release and tag if exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true
          
          # Write release notes to file
          cat > release_notes.md << 'RELEASE_NOTES_EOF'
          # blbl - AI Enhanced Edition v${{ env.VERSION_NAME }}

          AI加强维护修改版本 | AI Enhanced Maintenance Build

          ---

          ## 🤖 AI加强维护版 | AI Enhanced Build

          > ⚠️ 本版本由AI优化维护，仅供个人学习研究使用，请勿用于商业用途。
          > ⚠️ This build is AI-enhanced and maintained for personal study only. Not for commercial use.

          ---

          ## 📋 免责声明 | Disclaimer

          - 本软件基于开源项目二次开发，版权归原作者所有
          - 本软件不提供任何担保，使用风险自负
          - 本软件仅供学习研究，请于下载后24小时内删除

          ---

          ## 🔧 v4.2 优化内容 | Optimizations

          ### 全面优化
          - ✅ 硬件加速 (渲染更快)
          - ✅ DiffUtil 列表更新 (更高效)
          - ✅ RecyclerView 缓存优化 (滚动更流畅)

          ### 流畅度优化
          - ✅ ImageLoader 缓存优化 (减少内存占用)
          - ✅ BiliClient 连接池优化 (网络更快)
          - ✅ BiliClient HTTP响应缓存 (减少重复请求)

          ### 基础优化
          - ✅ 默认播放器: IjkPlayer
          - ✅ 默认画质: 1080p
          - ✅ 图片质量: low (减少内存)
          - ✅ 直播高码率: 开启

          ---

          ## 📺 设备支持 | Device Support

          - Android TV / 盒子 (Android 5.0+)
          - 平板 (Android 5.0+)
          - 车机 (Android 5.0+)

          ---

          ## 📥 安装说明 | Installation

          1. 下载 APK 文件
          2. 复制到 U 盘
          3. 插入设备
          4. 使用文件管理器安装

          ---

          ## 🔗 项目地址 | Repository

          - Fork: https://github.com/min09577/blbl
          - Original: https://github.com/cat3399/blbl
          RELEASE_NOTES_EOF
          
          # Create release with notes file
          gh release create "$TAG" "$APK" \
            --title "blbl AI Enhanced $TAG" \
            --notes-file release_notes.md
