name: Android TV Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.1.1)"
        required: true
      changelog:
        description: "Release notes/changelog (optional; supports multiline)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: CI Gradle tuning (limit heap for 7GB runner)
        run: |
          cat >> gradle.properties << 'EOF'
          # CI overrides: GitHub Actions ubuntu-latest has 7GB RAM, 2 cores
          org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC
          org.gradle.workers.max=1
          org.gradle.parallel=true
          EOF
          echo "=== Effective gradle.properties (last lines) ==="
          tail -20 gradle.properties

      - name: Generate keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=BLBL, OU=Dev, O=BLBL, L=Shanghai, C=CN"

      - name: Build signed APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ inputs.version_name }} \
            -PversionCode=${{ github.run_number }} \
            --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk \
            "output/blbl-tv-v${{ inputs.version_name }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blbl-tv-apk
          path: "output/blbl-tv-v${{ inputs.version_name }}.apk"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version_name }}"
          APK="output/blbl-tv-v${{ inputs.version_name }}.apk"

          # Delete existing release and tag if exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true

          # Create release
          gh release create "$TAG" "$APK" \
            --title "blbl TV v${{ inputs.version_name }}" \
            --notes "${{ inputs.changelog }}"
