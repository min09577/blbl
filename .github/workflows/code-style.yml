name: Code Style

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.editorconfig'
      - 'gradle/libs.versions.toml'
      - 'config/detekt/**'
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.editorconfig'
      - 'gradle/libs.versions.toml'
      - 'config/detekt/**'

permissions:
  contents: read

# Node.js 24 migration: force actions to run on Node.js 24
# Required starting June 16, 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: ktlintCheck
        run: ./gradlew :app:ktlintCheck --no-daemon

  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: detekt
        run: ./gradlew :app:detekt --no-daemon
