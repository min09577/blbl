org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200

# Serial execution (low memory)
org.gradle.parallel=false
org.gradle.workers.max=1

# Build cache
org.gradle.caching=false

# Configuration cache (generateProto + checkThemeTokens not compatible)
org.gradle.configuration-cache=false

# Configuration on demand
org.gradle.configureondemand=true

android.nonTransitiveRClass=true

versionCode=240018
versionName=v2400.1.9

# Kotlin compiler options (for AGP 9.x bundled Kotlin)
kotlin.jvm.target.version=17
kotlin.compiler.freeArgs=-Xno-call-assertions,-Xno-param-assertions,-Xno-receiver-assertions,-Xjvm-default=all
kotlin.compiler.suppressExperimentalWarning=true

# R8 / DEX optimization
android.r8.maxWorkers=1
